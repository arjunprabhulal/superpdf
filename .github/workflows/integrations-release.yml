name: Integrations release

# Publishes langchain-superpdf or llama-index-readers-superpdf to PyPI when a tag like
# langchain-superpdf-v0.1.0 or llama-index-readers-superpdf-v0.1.0 is pushed.
# Authentication is PyPI trusted publishing (OIDC): no token is stored in this repository.

on:
  push:
    tags: ["langchain-superpdf-v*", "llama-index-readers-superpdf-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Find the package and check the tag matches its version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="${TAG%-v*}"
          tag_version="${TAG##*-v}"
          case "$package" in
            langchain-superpdf|llama-index-readers-superpdf) ;;
            *) echo "::error::Unknown package in tag $TAG"; exit 1 ;;
          esac
          version="$(uv run --no-project --python 3.13 python -c "import tomllib;print(tomllib.load(open('integrations/$package/pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Tag $TAG does not match $package $version"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Test and build
        working-directory: integrations/${{ steps.tag.outputs.package }}
        run: |
          uv sync --locked
          uv run pytest -q
          uv build
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: integrations/${{ steps.tag.outputs.package }}/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.package }}
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
