name: Integrations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [langchain-superpdf, llama-index-readers-superpdf]
    defaults:
      run:
        working-directory: integrations/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

  test:
    name: ${{ matrix.package }} on Python ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [langchain-superpdf, llama-index-readers-superpdf]
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: integrations/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The integration tests read the example PDF with this commit's reader (bin/superpdf.js).
      - run: npm ci
        working-directory: .
      - run: uv sync --locked
      - name: Unit tests (no network)
        if: matrix.package == 'langchain-superpdf'
        run: uv run pytest -q -rs tests/unit_tests --disable-socket --allow-unix-socket
      - run: uv run pytest -q -rs

  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [langchain-superpdf, llama-index-readers-superpdf]
    defaults:
      run:
        working-directory: integrations/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - run: uvx twine check --strict dist/*
