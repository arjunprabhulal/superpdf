name: Release

# Publishes @superpdf/cli to npm when a GitHub release is published.
# Authentication is npm trusted publishing (OIDC): no npm token is stored in
# this repository. The release is staged on npm and goes live after a
# maintainer approves it with two-factor authentication.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency cache in release builds
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
      - name: Use npm 11.15 or later (staged publishing)
        run: |
          if ! node -e "const [a,b]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)" "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version
      - run: npm ci
      - run: npm test
      - name: Skip if this version is already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@superpdf/cli@$version" version >/dev/null 2>&1; then
            echo "@superpdf/cli@$version is already on npm (published by hand); nothing to stage."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage the release on npm
        if: steps.npm.outputs.published != 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm stage publish --tag next
          else
            npm stage publish
          fi
