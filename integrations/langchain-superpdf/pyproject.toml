[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-superpdf"
dynamic = ["version"]
description = "LangChain document loader for superPDF AI: local PDFs as Markdown with tables, charts as data and OCR."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arjun Prabhulal", email = "arjun.prabhulal@gmail.com" }]
keywords = ["langchain", "document-loader", "pdf", "pdf-ai", "superpdf", "pdf-to-markdown", "rag", "ocr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=0.3,<2", "superpdf>=0.3.1,<1"]

[project.urls]
Homepage = "https://superpdf.ai"
Documentation = "https://superpdf.ai/docs/python/langchain-llamaindex"
Source = "https://github.com/arjunprabhulal/superpdf/tree/main/integrations/langchain-superpdf"
Issues = "https://github.com/arjunprabhulal/superpdf/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.6", "mypy>=1.11", "langchain-community>=0.3"]

[tool.uv.sources]
# Develop against this repository's superpdf package; the published wheel depends on superpdf from PyPI.
superpdf = { path = "../../python", editable = true }

[tool.hatch.version]
path = "langchain_superpdf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_superpdf"]

[tool.hatch.build.targets.sdist]
include = ["langchain_superpdf", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real superPDF CLI (needs Node.js 22+)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-third-party = ["superpdf"]
