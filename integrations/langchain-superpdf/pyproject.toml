[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-superpdf"
version = "0.1.0"
description = "LangChain document loader for superPDF AI: local PDFs as Markdown with tables, charts as data and OCR."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arjun Prabhulal", email = "arjun.prabhulal@gmail.com" }]
keywords = ["langchain", "document-loader", "pdf", "pdf-ai", "superpdf", "pdf-to-markdown", "rag", "ocr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=1.0.0,<2.0.0", "superpdf>=0.3.1,<1.0.0"]

[project.urls]
Homepage = "https://superpdf.ai"
Documentation = "https://superpdf.ai/docs/python/langchain-llamaindex"
Repository = "https://github.com/arjunprabhulal/superpdf/tree/main/integrations/langchain-superpdf"
Issues = "https://github.com/arjunprabhulal/superpdf/issues"
Changelog = "https://github.com/arjunprabhulal/superpdf/blob/main/integrations/langchain-superpdf/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
]
test_integration = []
lint = ["ruff>=0.13.1,<0.14.0"]
typing = ["mypy>=1.11,<3.0.0"]
dev = []

[tool.uv.sources]
# Develop against this repository's superpdf package; the published wheel depends on superpdf from PyPI.
superpdf = { path = "../../python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["langchain_superpdf"]

[tool.hatch.build.targets.sdist]
include = ["langchain_superpdf", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
default-groups = ["test", "test_integration", "lint", "typing", "dev"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = ["compile: mark placeholder test used to compile integration tests without running them"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Messes with the formatter
    "PLC0415", # Import top of file
    "FIX002",  # TODO
    "TD002",   # TODO
    "TD003",   # TODO
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "C901",    # Too complex

    # TODO
    "ANN204",
    "ANN401",
    "TRY201",
    "ARG002",
    "N803",
    "TC002",
    "TC003",
    "TRY300",
    "N806",
]
unfixable = ["B028"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-third-party = ["superpdf"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Tests need assertions
    "SLF001",  # Private member access in tests
    "PLR2004", # Comparison to magic number
    "PT011",   # Exception too broad
]
